name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

# Least privilege by default; the publish jobs ask for what they need.
permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Reads volta.node from package.json, matching local development.
          node-version-file: package.json
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Validate this repo's workflows with SecureCI (dogfooding)
        run: |
          node dist/cli.js validate .github/workflows/ci.yaml
          node dist/cli.js run .github/workflows/ci.yaml --dry-run

  publish:
    name: Publish to npm
    needs: test
    # Release on merge to main: publishes the version in package.json only if
    # it isn't already on npm. To cut a release, bump "version" in your PR
    # before merging. Other merges are no-ops (no version change = no publish),
    # so there is no bump-commit pushed back to main and no trigger loop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag and GitHub release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the test job and local dev (volta.node in package.json).
          node-version-file: package.json
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        run: |
          if npm view "@secureci/cli@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@secureci/cli@${{ steps.pkg.outputs.version }} is already on npm; nothing to release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.pkg.outputs.version }}" \
            --generate-notes
