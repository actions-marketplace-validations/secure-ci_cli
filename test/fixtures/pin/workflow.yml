# Fixture for `secureci pin`: formatting and comments must survive.
name: Pin fixture
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node   # a step comment
        uses: 'actions/setup-node@v4.1.0'
        with:
          node-version: 20
      - uses: "github/codeql-action/init@v3" # v2.9
      - uses: org/scan@v1 # needed for the audit
      -   uses:   org/deploy@main
      - uses: actions/cache@0123456789abcdef0123456789abcdef01234567 # v4
      - uses: docker://alpine:3.20
      - uses: ./.github/actions/local
      - uses: trusted/tool@v2
      - uses: gone/away@v1
      - {uses: actions/upload-artifact@v4, with: {name: out}}
      - run: |
          echo "uses: actions/checkout@v4 is just text here"
  call:
    uses: org/workflows/.github/workflows/build.yml@v1
